packages:
  # pnpm 12 workspace discovery requires patterns without a leading "./".
  - common
  - core
  - drivers
  - examples
verifyDepsBeforeRun: false
allowBuilds:
  '@openrouter/sdk': false
  '@google/genai': true
  esbuild: true
  protobufjs: true
blockExoticSubdeps: true
minimumReleaseAge: 4320 # 3 days in minutes, minimumReleaseAge protects against supply chain attacks.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/foundry-sdk@0.5.2'
  # Current Images API and Responses image-tool SDK types.
  - openai@7.25.0
  - '@vertesia/*'
  - '@llumiverse/*'
  # Gemini 4 Argon long decode (automatic continuation) needs @google/genai >= 2.29.1.
  - '@google/genai@2.30.0'
  # Sonnet 5.5 native thinking types and aligned platform wrappers.
  - '@anthropic-ai/sdk@0.129.0'
  - '@anthropic-ai/vertex-sdk@0.20.0'
  - '@anthropic-ai/bedrock-sdk@0.34.0'
  # Security fixes published inside the 3-day cooldown.
  - brace-expansion@5.0.12
  - '@grpc/grpc-js@1.14.5'

catalog:
  # Keep this synchronized with Studio and ComposableAI: each repository generates schemas from
  # its own local workspace and lockfile, so an override in another repository cannot control it.
  zod: "4.6.7"
  vitest: "5.0.4"
  typescript: "7.0.2"
  "@types/node": "^24.19.2"
  google-auth-library: "^11.3.1"
overrides:
  # GHSA-68fv-2mgg-jv7q: validate indexed source-map section offsets.
  "source-map-js@<1.2.2": 1.2.2
  # ============================
  # Special Overrides
  # ============================
  # We have these for more than simple CVE fixes, but may also do that. Or have complex requirements to track.

  # Pin single google-auth-library
  google-auth-library: 'catalog:'

  # Force Node 24 types.
  "@types/node": 'catalog:'

  # ============================
  # Standard CVE overrides
  # ============================
  # Vite and launch-editor Windows disclosure and command execution advisories.
  vite: ^8.3.4
  "brace-expansion@>=3.0.0 <5.0.12": 5.0.12
  # GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g,
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp, and GHSA-xhq7-xmqj-769h.
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "@grpc/grpc-js@>=1.14.0 <1.14.5": 1.14.5
  # GHSA-2v37-7h3g-55p8: zero-sized custom generators can loop indefinitely.
  "nanoid@<3.3.17": 3.3.18
  # GHSA path traversal in sourceMappingURL auto-loading. Reached via vitest > vite > postcss.
  "postcss@<8.5.18": ^8.5.18
  protobufjs@<=7.6.4: 7.6.5
  # GHSA-xcx6-jx8p-x3h5: auth-code flow parameter disclosure. @azure/identity still declares ^6, but
  # MSAL Node 7's only breaking change removes responseMode from acquireTokenInteractive, which it does not use.
  "@azure/msal-node@<7.1.0": ^7.1.0
  # GHSA-mrhx-c7xc-m3w5: SDK peers otherwise resolve an older zod 4 than the catalog.
  "zod@>=4.0.0 <4.6.6": 4.6.7

# Share package directories across local worktrees.
virtualStoreType: global
