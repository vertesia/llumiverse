name: (test) Build and test

on:
  push:
    branches:
      - main
      - preview
      - "release/**"
      - "production/**"
      - "hotfix**"
      - "repo-dispatch**"
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded runs for the same event ref (latest push or PR update wins).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Scopes provider API keys (OPENAI, MISTRAL, GROQ, TOGETHER, etc.) to a
    # dedicated environment (zizmor: secrets-outside-env).
    environment: build
    permissions:
      id-token: write # required for OIDC federation with GCP and AWS
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install workspace dependencies
        run: pnpm install
      - name: Save pnpm store cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Build workspace
        run: pnpm build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: gauth
        with:
          project_id: "dengenlabs"
          workload_identity_provider: "projects/265888598630/locations/global/workloadIdentityPools/composable-cloud/providers/github"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::716085231028:role/ComposablePromptExecutor
          role-session-name: github-actions
          aws-region: us-east-1

      - name: Typecheck and functional tests
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BEDROCK_REGION: us-east-1
          GOOGLE_PROJECT_ID: dengenlabs
          GOOGLE_REGION: us-central1
        run: pnpm typecheck:test && npx vitest --exclude '**/*.live.test.ts'

      - name: Curated live provider smoke tests
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BEDROCK_REGION: us-east-1
          BEDROCK_MANTLE_REGION: us-east-1
          GOOGLE_PROJECT_ID: dengenlabs
          GOOGLE_REGION: us-central1
        run: npx vitest --exclude '**/!(*.live).test.ts'

  notify-repo-composableai:
    name: Notify vertesia/composableai of new commit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/repo-dispatch'))
    needs:
      - build-and-test
    # Scopes the cross-repo dispatch token to a dedicated environment.
    environment: build
    steps:
      - name: Notify repository vertesia/composableai
        env:
          REPO_COMPOSABLEAI_ACCESS_TOKEN: ${{ secrets.REPO_COMPOSABLEAI_ACCESS_TOKEN }}
          LLUMIVERSE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${REPO_COMPOSABLEAI_ACCESS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --fail-with-body \
            https://api.github.com/repos/vertesia/composableai/dispatches \
            -d "$(jq -nc \
              --arg sha "${LLUMIVERSE_SHA}" \
              --arg branch "${BRANCH}" \
              '{event_type: "update-git-submodule-request", client_payload: {llumiverse_sha: $sha, branch: $branch}}')"
