name: (lint) Lint codebase

on:
  push:
    branches:
      - main
      - "release/**"
      - "production/**"
      - "hotfix**"
      - "repo-dispatch**"
  workflow_call:
  workflow_dispatch:

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded runs for the same event ref (latest push or PR update wins).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Check codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Older release refs predate .node-version; preserve their Node 24 setup.
          node-version: ${{ hashFiles('.node-version') == '' && '24' || '' }}
          node-version-file: ${{ hashFiles('.node-version') != '' && '.node-version' || '' }}
          package-manager-cache: false
      - name: Test automerge CI policy
        run: node --test .github/bin/automerge-ci.node-test.mjs .github/bin/automerge-dispatch.test.mjs .github/bin/ci-approve.test.mjs
      - name: Test setup-node version pins
        run: node --test .github/bin/setup-node-version.test.mjs
      - name: Test release retries and channels
        run: |
          bash .github/bin/lib-release-cohort.test.sh
          bash .github/bin/publish-all-packages.test.sh
          bash .github/bin/lib-package-channel.test.sh
      - name: Test package tarball verification
        run: |
          node --test .github/bin/verify-package-tarball.test.mjs
          bash .github/bin/publish-package-verification.test.sh
      - name: Test automation notifications
        run: node --test .github/bin/automation-notification.test.mjs
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Renovate config
        run: pnpm run ci:renovate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Save pnpm store cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Check codebase
        run: pnpm check
