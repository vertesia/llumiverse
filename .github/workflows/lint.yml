name: (lint) Lint codebase

on:
  push:
    branches:
      - main
      - preview
      - "release/**"
      - "production/**"
      - "hotfix**"
      - "repo-dispatch**"
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded runs for the same event ref (latest push or PR update wins).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Check codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Renovate config
        run: pnpm run ci:renovate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Save pnpm store cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Check codebase
        run: pnpm check
