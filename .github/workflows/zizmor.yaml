name: (security) Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch (latest push wins).
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Run zizmor security audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload SARIF results to Code Scanning
      contents: read # required for actions/checkout to read the repo tree
      actions: read # required by upload-sarif to enrich findings with workflow context
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor@1.32.0 --no-exit-codes --persona=auditor --format=sarif .github > results.sarif

      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: zizmor
