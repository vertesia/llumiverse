name: (backport) automerge clean backport PRs
run-name: >-
  ${{
    github.event.workflow_run.pull_requests[0].number
    && format(
      '(backport) automerge clean backport PR #{0}',
      github.event.workflow_run.pull_requests[0].number
    )
    || format(
      '(backport) automerge clean backport PR ({0})',
      github.event.workflow_run.head_branch
    )
  }}

on:
  # zizmor: ignore[dangerous-triggers] This intentionally chains after successful
  # backport-branch CI, then re-checks the exact head SHA before merging.
  workflow_run:
    workflows:
      - "(test) Build and test"
      - "(lint) Lint codebase"
    types:
      - completed
    branches:
      - "backport-*"

# Serialize eligibility, notification, and its marker so CI completions cannot
# both notify before either has recorded the one-time manual-review warning.
concurrency:
  group: backport-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read # required to inspect workflow run status for the exact backport head SHA
  contents: read # required for repository metadata access through gh
  pull-requests: read # required to inspect PR metadata, labels, and commits

jobs:
  approve-and-merge:
    name: >-
      ${{
        github.event.workflow_run.pull_requests[0].number
        && format(
          'Approve and merge clean backport PR #{0}',
          github.event.workflow_run.pull_requests[0].number
        )
        || format(
          'Approve and merge clean backport PR for {0}',
          github.event.workflow_run.head_branch
        )
      }}
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'backport-')
    runs-on: ubuntu-slim
    environment: renovate-automerge
    timeout-minutes: 10
    outputs:
      attention_reason: ${{ steps.eligibility.outputs.attention_reason }}
      manual_review_pr: ${{ steps.eligibility.outputs.manual_review_pr }}
    steps:
      # workflow_run is privileged: execute policy only from the trusted workflow commit.
      - name: Checkout trusted CI policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/bin
      - name: Set up Node.js for CI policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check automerge eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          {
            echo "should_merge=false"
            echo "pr_url="
          } >> "$GITHUB_OUTPUT"

          prs_json="$(gh pr list \
            --repo "$REPO" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number,url,author,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,isCrossRepository,labels,mergeStateStatus,commits \
            --limit 10)"

          pr_count="$(jq 'length' <<< "$prs_json")"
          if [[ "$pr_count" == "0" ]]; then
            echo "No open PR found for $HEAD_BRANCH."
            exit 0
          fi
          if [[ "$pr_count" != "1" ]]; then
            echo "Expected exactly one open PR for $HEAD_BRANCH, found $pr_count." >&2
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "$prs_json")"
          pr_url="$(jq -r '.[0].url' <<< "$prs_json")"
          author_login="$(jq -r '.[0].author.login // ""' <<< "$prs_json")"
          base_ref="$(jq -r '.[0].baseRefName' <<< "$prs_json")"
          head_ref="$(jq -r '.[0].headRefName' <<< "$prs_json")"
          head_sha="$(jq -r '.[0].headRefOid' <<< "$prs_json")"
          head_repo="$(jq -r '.[0].headRepository.nameWithOwner // ""' <<< "$prs_json")"
          head_owner="$(jq -r '.[0].headRepositoryOwner.login // ""' <<< "$prs_json")"
          is_cross_repo="$(jq -r '.[0].isCrossRepository' <<< "$prs_json")"
          is_draft="$(jq -r '.[0].isDraft' <<< "$prs_json")"
          merge_state="$(jq -r '.[0].mergeStateStatus // ""' <<< "$prs_json")"
          commit_count="$(jq '.[0].commits | length' <<< "$prs_json")"
          repo_owner="${REPO%%/*}"

          # Backport PRs are opened by the release-bot App (see .github/bin/backport.sh).
          # This must stay distinct from the automerge App that approves below, otherwise
          # the approval would not count under branch protection.
          if [[ "$author_login" != "app/vertesia-release-bot" && "$author_login" != "vertesia-release-bot[bot]" ]]; then
            echo "Skipping PR #$pr_number: author is $author_login, not the release-bot."
            exit 0
          fi
          if [[ "$head_ref" != "$HEAD_BRANCH" ]]; then
            echo "Skipping PR #$pr_number: PR head branch $head_ref does not match workflow branch $HEAD_BRANCH."
            exit 0
          fi
          # backport.sh names branches backport-<PR>-to-<sanitized-target>.
          if [[ ! "$head_ref" =~ ^backport-[0-9]+-to-.+$ ]]; then
            echo "Skipping PR #$pr_number: head branch $head_ref is not a backport branch."
            exit 0
          fi
          if [[ "$is_cross_repo" != "false" ]]; then
            echo "Skipping PR #$pr_number: PR is from a fork."
            exit 0
          fi
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "Skipping PR #$pr_number: head repository is $head_repo, not $REPO."
            exit 0
          fi
          if [[ "$head_owner" != "$repo_owner" ]]; then
            echo "Skipping PR #$pr_number: head repository owner is $head_owner, not $repo_owner."
            exit 0
          fi
          # backport.sh only targets main or release/X.Y; both are eligible for automerge.
          if [[ "$base_ref" != "main" && ! "$base_ref" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping PR #$pr_number: base branch is $base_ref, not main or release/X.Y."
            exit 0
          fi
          # Conflicted backports open as drafts; never auto-merge them.
          if [[ "$is_draft" != "false" ]]; then
            echo "Skipping PR #$pr_number: PR is draft (conflicted backport awaiting manual resolution)."
            exit 0
          fi
          if [[ "$head_sha" != "$HEAD_SHA" ]]; then
            echo "Skipping PR #$pr_number: workflow SHA $HEAD_SHA does not match current PR head $head_sha."
            exit 0
          fi
          if ! jq -e '.[0].labels | any(.name == "backport")' <<< "$prs_json" >/dev/null; then
            echo "Skipping PR #$pr_number: missing backport label."
            exit 0
          fi
          # A clean backport is exactly one cherry-pick commit on top of the target (the
          # repo squash-merges, so the source is a single commit). More than one commit
          # means the branch was pushed to after creation -> leave it for manual review.
          # NOTE: unlike the renovate/sync automerge flows there is no file whitelist (a
          # backport carries an arbitrary, already-reviewed diff) and no commit-author
          # check (git cherry-pick preserves the original author). Integrity rests on the
          # author/branch/label/commit-count gates here plus the head-SHA match and the
          # required-CI checks below.
          if [[ "$commit_count" != "1" ]]; then
            echo "Skipping PR #$pr_number: expected exactly 1 commit, found $commit_count."
            # This condition persists across CI workflows, reruns, and new commits.
            # Trust only a marker posted by this repository's Actions bot.
            comments="$(gh api --paginate --slurp "repos/$REPO/issues/$pr_number/comments?per_page=100")"
            if jq -e 'any(.[][];
              .user.login == "github-actions[bot]" and .user.type == "Bot" and
              ((.body // "") | contains("<!-- backport-multiple-commits-notified:v1 -->"))
            )' <<< "$comments" >/dev/null; then
              echo "Manual-review notification already requested for PR #$pr_number."
              exit 0
            fi
            echo "manual_review_pr=$pr_number" >> "$GITHUB_OUTPUT"
            echo "attention_reason=Backport has multiple commits and requires manual review before merging." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$merge_state" == "DIRTY" ]]; then
            echo "Skipping PR #$pr_number: merge state is DIRTY (target advanced into a conflict); leaving for manual resolution."
            echo "attention_reason=Backport has merge conflicts with the target branch. Resolve them before merging." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #$pr_number by $author_login is eligible for automerge after workflow checks pass."

          required_workflows=(
            "build-and-test.yml"
            "lint.yml"
          )

          if ! node .github/bin/automerge-ci.mjs "$pr_number" "${required_workflows[@]}"; then
            exit 0
          fi

          {
            echo "should_merge=true"
            echo "pr_url=$pr_url"
          } >> "$GITHUB_OUTPUT"

      - name: Generate automerge token
        if: steps.eligibility.outputs.should_merge == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_VERTESIA_RENOVATE_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERTESIA_RENOVATE_AUTOMERGE_PEM }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and merge clean backport PR
        if: steps.eligibility.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_URL: ${{ steps.eligibility.outputs.pr_url }}
        run: |
          set -euo pipefail

          gh pr review "$PR_URL" \
            --approve \
            --body "Auto-approved clean backport after build/test and lint passed for ${HEAD_SHA}."

          # The eligibility gate above only waits for the build/test and lint workflows.
          # The base branch rulesets also enforce gates that complete independently of
          # them: CodeQL code scanning (GitHub's default setup, so there is no workflow
          # file we could gate on) and, on some branches, Copilot code review. Merging
          # immediately races those and fails with "the base branch policy prohibits the
          # merge", which strands the PR approved but unmerged for good, because nothing
          # re-triggers this workflow once the workflows it does gate on have completed.
          # Let GitHub settle the merge state first, then merge the exact head SHA below.
          merge_state_timeout=180
          merge_state_poll=10

          deadline=$(( SECONDS + merge_state_timeout ))
          while :; do
            pr_state="$(gh pr view "$PR_URL" --repo "$REPO" --json headRefOid,mergeStateStatus)"
            settled_head_sha="$(jq -r '.headRefOid' <<< "$pr_state")"
            settled_state="$(jq -r '.mergeStateStatus // ""' <<< "$pr_state")"

            if [[ "$settled_head_sha" != "$HEAD_SHA" ]]; then
              echo "Not merging $PR_URL: head moved from $HEAD_SHA to $settled_head_sha." >&2
              echo "The run triggered by the new head is responsible for merging it." >&2
              exit 1
            fi

            # CLEAN and HAS_HOOKS are mergeable. UNSTABLE means only non-required checks
            # are failing, which the merge below accepted before this wait existed.
            if [[ "$settled_state" == "CLEAN" || "$settled_state" == "HAS_HOOKS" || "$settled_state" == "UNSTABLE" ]]; then
              echo "Merge state is '$settled_state'; proceeding to merge $HEAD_SHA."
              break
            fi

            if [[ "$settled_state" == "DIRTY" ]]; then
              echo "Not merging $PR_URL: the PR has merge conflicts." >&2
              exit 1
            fi

            if [[ "$settled_state" == "BEHIND" ]]; then
              echo "Not merging $PR_URL: the base branch advanced; update or rebase the PR first." >&2
              exit 1
            fi

            if [[ "$settled_state" == "DRAFT" ]]; then
              echo "Not merging $PR_URL: the PR became a draft." >&2
              exit 1
            fi

            if (( SECONDS >= deadline )); then
              echo "Not merging $PR_URL: merge state still '$settled_state' after ${merge_state_timeout}s." >&2
              exit 1
            fi

            echo "Merge state is '$settled_state'; waiting for branch protection to settle."
            sleep "$merge_state_poll"
          done

          gh pr merge "$PR_URL" \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"

  notify-failure:
    needs: approve-and-merge
    if: >-
      always() && (needs.approve-and-merge.result == 'failure' ||
      needs.approve-and-merge.outputs.attention_reason != '')
    uses: ./.github/workflows/notify-automation.yaml # zizmor: ignore[self-repository] actionlint does not yet support $/ workflow references.
    with:
      branch: ${{ github.event.workflow_run.head_branch }}
      sha: ${{ github.event.workflow_run.head_sha }}
      reason: ${{ needs.approve-and-merge.outputs.attention_reason || 'Automatic merge or conflict repair failed. Review the workflow run and merge the PR manually once resolved.' }}

  record-manual-review-notification:
    name: Record manual-review notification
    needs: [approve-and-merge, notify-failure]
    if: >-
      needs.notify-failure.result == 'success' &&
      needs.notify-failure.outputs.notification_requested == 'true' &&
      needs.approve-and-merge.outputs.manual_review_pr != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write # Persist the notification marker as a PR comment.
    steps:
      - name: Mark the multiple-commit warning as requested
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.approve-and-merge.outputs.manual_review_pr }}
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST \
            --raw-field 'body=<!-- backport-multiple-commits-notified:v1 -->
          This backport has multiple commits and requires manual review. A contributor notification has been requested; subsequent automerge checks will not repeat this warning.'
