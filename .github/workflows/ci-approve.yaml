name: (ci) Approve tested pull requests

on:
  # zizmor: ignore[dangerous-triggers] Runs only trusted default-branch scripts; never executes PR code or artifacts.
  workflow_run:
    # "(ci) PR event" signals a PR change, such as a push, a label or a new base: pull_request_target
    # is blocked in public repositories from 2026-12-02. The others are CI completions.
    workflows: ["(ci) PR event", "(ci) PR validation", "(test) Build and test", "(lint) Lint codebase"]
    types: [completed]
  # Default-branch-only manual reconciliation. Send client_payload.pr_number to select one PR;
  # omit it to reconcile all open PRs.
  repository_dispatch:
    types: [ci-approve-reconcile]

permissions: {}

jobs:
  discover:
    name: Resolve approval branches
    # Discovery only reads metadata; publishing jobs use the actual branch lock below.
    concurrency:
      group: ci-approve-discovery-${{ github.repository }}-${{ github.event.workflow_run.head_branch || github.event.client_payload.pr_number || 'manual' }}
      cancel-in-progress: false
      queue: max
    # A skipped run changes nothing: the signal skips an edit that keeps the base, and a skipped CI
    # run tested nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # Read the trusted discovery script at the workflow commit.
      pull-requests: read # Resolve manual reconciliation targets to their PR head branches.
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Checkout trusted approval policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/bin
          persist-credentials: false
          submodules: false
      - name: Resolve branches
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/bin/ci-approve.mjs --discover
  approve:
    name: Reconcile CI approvals
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    permissions:
      contents: read # Read the trusted approval policy at the workflow commit.
      actions: read # Inspect CI runs and jobs; the hand-off uses a separately scoped App token.
      pull-requests: read # Read PR metadata, changed files and existing reviews.
      statuses: write # Publish the approval gate status on the evaluated PR head.
    if: needs.discover.outputs.branches != '[]'
    runs-on: ubuntu-slim
    environment: renovate-automerge
    timeout-minutes: 15
    # Serialize approval publishers for the same branch, including pending runs.
    concurrency:
      group: ci-approve-${{ github.repository }}-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout trusted approval policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/bin
          persist-credentials: false
          submodules: false
      - name: Generate review token
        id: review-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_VERTESIA_RENOVATE_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERTESIA_RENOVATE_AUTOMERGE_PEM }}
          permission-pull-requests: write
      - name: Generate membership token
        id: membership-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_VERTESIA_RENOVATE_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERTESIA_RENOVATE_AUTOMERGE_PEM }}
          permission-members: read
      - name: Generate automerge hand-off token
        if: >-
          startsWith(matrix.branch, 'renovate/') ||
          startsWith(matrix.branch, 'backport-') ||
          startsWith(matrix.branch, 'release-bump-')
        id: handoff-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_VERTESIA_RENOVATE_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERTESIA_RENOVATE_AUTOMERGE_PEM }}
          permission-contents: write # Create a default-branch-only repository_dispatch event.
      - name: Reconcile approvals
        env:
          CI_APPROVAL_BRANCH: ${{ matrix.branch }}
          GH_HANDOFF_TOKEN: ${{ steps.handoff-token.outputs.token }}
          GH_MEMBERS_TOKEN: ${{ steps.membership-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REVIEW_TOKEN: ${{ steps.review-token.outputs.token }}
        run: node .github/bin/ci-approve.mjs
